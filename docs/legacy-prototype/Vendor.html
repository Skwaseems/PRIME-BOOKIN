<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Primebookin Partner Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 font-sans">
  <div class="max-w-md mx-auto bg-white p-6 rounded-2xl shadow border">
    <h2 class="text-lg font-black text-red-600 mb-4 border-b pb-2">PRIMEBOOKIN PARTNER REGISTRATION</h2>
    
    <div class="space-y-3">
      <input type="text" id="vName" placeholder="Full Owner Name" class="w-full text-xs p-3 border rounded-xl">
      <input type="text" id="vPhone" placeholder="Mobile Number" class="w-full text-xs p-3 border rounded-xl">
      <input type="text" id="vBusiness" placeholder="Business Name" class="w-full text-xs p-3 border rounded-xl">
      
      <select id="vRole" class="w-full text-xs p-3 border rounded-xl bg-white">
        <option value="Hotel Owner (Primehotels)">Hotel Owner (Primehotels)</option>
        <option value="Restaurant Owner (Primebookin Restaurant)">Restaurant Owner</option>
        <option value="Medical Store Owner">Medical Store Owner</option>
        <option value="Cab Agent">Cab / Taxi Operator</option>
        <option value="Delivery Partner">Delivery Partner</option>
      </select>

      <button onclick="submitVendor()" class="w-full bg-red-600 text-white text-xs py-3 rounded-xl font-bold">
        Submit Registration Details
      </button>
    </div>
  </div>

  <script>
    function submitVendor() {
      const name = document.getElementById('vName').value;
      const phone = document.getElementById('vPhone').value;
      const businessName = document.getElementById('vBusiness').value;
      const role = document.getElementById('vRole').value;

      if (!name || !phone || !businessName) {
        alert("Please complete all registration fields.");
        return;
      }

      const newVendor = { name, phone, businessName, role, status: 'pending' };
      const vendors = JSON.parse(localStorage.getItem('pb_vendors') || '[]');
      vendors.push(newVendor);
      localStorage.setItem('pb_vendors', JSON.stringify(vendors));

      alert("Registration submitted! Opening Admin dashboard to verify request.");
      document.getElementById('vName').value = '';
      document.getElementById('vPhone').value = '';
      document.getElementById('vBusiness').value = '';
    }
  </script>
</body>
</html>
